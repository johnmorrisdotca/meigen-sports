# Publishes the demo to GitHub Pages on every push to main. Nothing here costs
# anything on a public repository.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm site
      - name: The bundled offline data and the data about to be published are one build
        run: node scripts/check-build.ts site
      - name: The golden facts hold in the data about to be published
        run: node scripts/check-golden.ts site/data/v1/0.1.0/facts
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: The live Pages site serves that same build
        run: node scripts/check-build.ts site --live "${{ steps.deployment.outputs.page_url }}" --wait 180
