name: Release
# Run by hand (Actions → Release → Run workflow) from main, or push a v<version> tag. The steps are kazoku-ui's shared release workflow
# (docs/release-workflow.md there): check the tag, run the check below, tag, attach the tarball to a GitHub release, publish to npm by trusted publishing.
# npm trusts this file by name (npmjs.com → the package → Settings → Trusted Publisher: release.yml), so publishing needs no token and no secret.
# The check is the package's, then the bundled offline data and the Pages data as one build (built here and live), the golden facts, and the packed package.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    uses: johnmorrisdotca/kazoku-ui/.github/workflows/reusable-release.yml@v0.7.3
    with:
      github-release: true
      check-command: >-
        pnpm check && pnpm build && pnpm site
        && node scripts/check-build.ts site --live https://johnmorrisdotca.github.io/meigen-sports/ --wait 420
        && node scripts/check-golden.ts site/data/v1/0.1.0/facts
        && node scripts/check-package.ts
